# The four ingestion pipelines of the O2 comparison, as compositions of stages.
#
# Same pattern as schema/schema_rules.yaml and lab/models.yaml: a declarative
# spec plus a small interpreter (src/iekg/pipeline.py). A pipeline is a
# configuration, not a module, so the four of them are not four copies of the
# same code drifting apart.
#
# They are a LADDER, not four systems. Each rung adds exactly one thing to the
# rung below, so a difference in the results is attributable. Comparing SPIRES
# against OneKE would say nothing; comparing "with and without candidate
# retrieval" says something.

version: 1

defaults:
  model: workhorse
  embedding_model: linker
  # Classes the pipeline is allowed to create. Everything else in the T-box
  # already exists and is read-only: the reference layer is never written.
  coinable: [Topic, Concept]
  options:
    retries: 2
    # Scope minted IRIs with the course code? Unscoped, two syllabi teaching
    # "Normalization" merge into one Concept. That is either the point of an
    # institutional layer or a silent conflation of two different things, and
    # the comparison should measure which. Open question, see CLAUDE.md §8.
    scope_iris: false
    # Retrieval decision rule. Both matter: measured cosine barely separates
    # the right unit from a plausible neighbour (0.733 vs 0.708) while leaving
    # an unrelated one far below (0.560), so the lead over the runner-up
    # carries more signal than the absolute score. See src/iekg/linking.py.
    candidates: 5
    threshold: 0.62
    margin: 0.03
    # Which side of the mention is compared against the backbone. The syllabi
    # are Spanish and the backbone is now bilingual (backbone_cs2023_es.ttl),
    # so matching in Spanish removes the language gap from the comparison and
    # stops the run depending on the model having translated well. English
    # stays canonical for identity; only the comparison changes language.
    # Flip it with --option link_language=en to measure the difference.
    link_language: es
    # How a Topic label is asked for. `verbatim` was the first wording and on
    # the real syllabus it returned the table of contents -- "CAPITULO 3 SQL
    # DDL (3 horas)" -- which cannot match any backbone label. Kept as an
    # option so the fix is a measurement, not an assertion.
    label_style: knowledge     # knowledge | verbatim
    # Send each per-topic call only the section of the document that topic
    # owns, sliced deterministically from the Markdown headings. Measured
    # 2026-08-15: with the whole syllabus attached to all ten calls, the stage
    # spent twenty-two minutes waiting on Groq's 8K tokens-per-minute ceiling
    # to re-send text the model had already been given nine times.
    focus_window: true
    # OneKE-style reflection: retry feeding the validation error back to the
    # model. A flag over a pipeline, never a fifth pipeline: it is one retry
    # policy, and PydanticAI already implements the mechanism.
    reflect: false

pipelines:

  P0:
    title: "Sin esquema"
    adds: "una llamada, 'extrae conceptos y relaciones'"
    isolates: "cuánto vale restringir"
    stages: [load, extract_free, build_abox]

  P1:
    title: "Una pasada restringida"
    adds: "T-Box verbalizada + salida tipada"
    isolates: "conformidad por prompt"
    stages: [load, verbalize, extract_typed, link_lexical, build_abox]

  P2:
    title: "Multi-etapa (SPIRES)"
    adds: "Temas -> Conceptos por tema"
    isolates: "si escalonar mejora"
    stages: [load, verbalize, extract_topics, extract_concepts, link_lexical, build_abox]

  P3:
    title: "+ linking con recuperación"
    adds: "candidatos del backbone por embedding + umbral y margen coseno"
    isolates: "el eslabón frágil"
    stages: [load, verbalize, extract_topics, extract_concepts, link_retrieval, build_abox]
