        label_en: "SQL Data Types"
        confidence: high
      - label_es: "Creación, modificación y borrado de tablas"
        label_en: "Table Creation, Alteration and Deletion"
        confidence: high
      - label_es: "Modificación de columnas y constraints"
        label_en: "Column Modification and Constraints"
        confidence: high
      - label_es: "Manejo de índices"
        label_en: "Index Management"
        confidence: high
      - label_es: "Uso de vistas"
        label_en: "Views"
        confidence: high

  - label_es: "Lenguaje de manipulación de datos y consultas (SQL DML)"
    label_en: "SQL Data Manipulation Language and Query Construction"
    links_to_ku: KU-DM-Querying
    confidence: high
    note: >-
      El capítulo más largo del curso (9 horas). Enlace directo y sin
