    concepts:
      - label_es: "Uso de operadores"
        label_en: "SQL Operators"
        confidence: high
      - label_es: "Manejo de fechas y expresiones aritméticas"
        label_en: "Date Handling and Arithmetic Expressions"
        confidence: high
      - label_es: "Agrupaciones"
        label_en: "Grouping and Aggregation"
        confidence: high
      - label_es: "Subconsultas escalares"
        label_en: "Scalar Subqueries"
        confidence: high
      - label_es: "Subconsultas correlacionadas"
