    label_en: "SQL Data Definition Language (DDL)"
    links_to_ku: KU-DM-Querying
    confidence: low
    note: >-
      El backbone no tiene una KU dedicada a definición de esquemas; Query
      Construction es el destino menos malo. Alternativa: KU-DM-Core.
      "Tipos de datos en SQL" figura en el Capítulo 2 del sílabo, junto a las
      metodologías de modelamiento, pero pertenece aquí: se movió a propósito.
      "Manejo de índices" se deja como concepto de DDL porque el curso lo
      enseña como sentencia, aunque conceptualmente pertenezca a
      KU-DM-Internals.
    concepts:
