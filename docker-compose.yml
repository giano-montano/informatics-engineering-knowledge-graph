# Neo4j del laboratorio: version pineada, plugins declarativos.
#
# Por que 5.26 LTS y no la 2026.06 actual:
#   - 5.26 es la ultima LTS, con soporte oficial hasta junio 2028, o sea que
#     cubre Tesis 2 y la defensa sin forzar una migracion a mitad de camino.
#   - Los releases CalVer (2025.x, 2026.x) no son LTS y tienen ventanas de
#     soporte cortas: pinear uno significa defender sobre una version sin soporte.
#   - Practicamente toda la documentacion, tutoriales y literatura que vas a
#     citar asume 5.x. Menos friccion al sustentar.
#   - Costo aceptado: Cypher 5 (sin Cypher 25) y GDS congelado en la linea 2.x.
#     Registrable como limitacion; ninguna de las dos cosas bloquea el pipeline.
#
# Edicion Enterprise bajo licencia de evaluacion (desarrollo y pruebas).
# El despliegue final va a Community, asi que NADA del diseno puede depender
# de multi-base: el backbone y el slice viven en la base `neo4j`.

name: iekg-lab

services:
  neo4j:
    image: neo4j:5.26.28-enterprise
    container_name: iekg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP - Neo4j Browser
      - "7687:7687"   # Bolt - driver de Python
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"

      # El entrypoint resuelve la version de cada plugin compatible con la
      # imagen y la descarga al arrancar. Queda registrado en los logs.
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'

      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"

      # 32 GB fisicos: heap holgado y pagecache suficiente para un grafo que
      # hoy son 180 nodos y no va a pasar de unos pocos miles.
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "4G"
      NEO4J_server_memory_pagecache_size: "2G"

      # Usada solo por el healthcheck. Sin prefijo NEO4J_ a proposito: cualquier
      # NEO4J_* desconocida hace fallar el arranque por strict validation.
      HEALTHCHECK_PASSWORD: "${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./ontology:/import/ontology:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${HEALTHCHECK_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
