# Model catalog for the lab. Same pattern as schema/schema_rules.yaml: a
# declarative spec plus a small interpreter (src/iekg/llm.py). Switching a
# model is an edit here, never a change in experiment code.
#
# Secrets are NOT here. Each entry NAMES the .env variable holding its key.
# Model ids are configuration, not secrets, so they belong in this versioned
# file rather than in .env.
#
# `tier` gates spending:
#   iteration -> renewable quota, safe to hammer while developing
#   final     -> scarce (hard credit cap or very low RPD); single measured run

version: 1

models:
  # ---------------------------------------------------------------- iteration
  workhorse:
    provider: google-gla
    model_id: gemini-3.7-flash
    api_key_env: GOOGLE_AI_STUDIO_API_KEY
    tier: final
    limits: "20 requests per DAY per model (measured 2026-08-14)"
    fallback_to: workhorse_alt
    notes: >
      Was the iteration default until the ceiling was measured instead of read.
      The quota is GenerateRequestsPerDayPerProjectPerModel-FreeTier = 20, not
      the "15 RPM / 1500 RPD" this entry used to claim. A staged pipeline costs
      1+N calls per syllabus, so twenty a day is two runs. Iteration moved to
      Groq; this stays for the final measured run. See findings/0005.
      Answers 503 "high demand" under load, which is capacity and not quota:
      the retrying transport absorbs the short ones, fallback_to covers the
      rest so a multi-stage run does not die on a provider's bad minute.

  workhorse_alt:
    provider: google-gla
    model_id: gemini-3.6-flash
    api_key_env: GOOGLE_AI_STUDIO_API_KEY
    tier: final
    limits: "free-tier daily cap, per model; not measured separately"
    notes: >
      Stand-in for workhorse when 3.7 Flash returns 503 OR runs out of daily
      quota. One version back in the same family, so behaviour is closest to
      what it replaces. The per-model daily cap is what makes it useful: it has
      its own bucket.
      A run that lands here is reported, never silently accepted -- and until
      2026-08-14 that promise was empty, because the fallback never fired.
      PydanticAI's FallbackModel switches on ModelAPIError, while the retrying
      transport raises httpx.HTTPStatusError. See findings/0005; the manifest
      of every run now records which model actually answered.
      NOTE: `gemini-3.1-flash`, listed in lab/docs/llms/gemini.md, does not
      exist on the API -- only -lite/-image/-tts variants of 3.1 do.

  reasoner:
    provider: groq
    model_id: qwen/qwen3.6-27b
    api_key_env: GROQ_API_KEY
    tier: iteration
    limits: "30 RPM / 1K RPD / 8K TPM / 200K TPD"
    thinking: false
    notes: >
      Artificial Analysis intelligence index 38, above gpt-oss-120b's 24.
      PREVIEW on Groq: it can be withdrawn without notice.
      `thinking: false` is load-bearing, not a tuning knob. With reasoning on,
      structured output succeeded 2/5; with it off, 5/5 and tokens fell from
      1419 to 588. Its reasoning stream interferes with emitting the tool
      call. Only the qwen3 family can disable reasoning on Groq.

  reasoner_fallback:
    provider: groq
    model_id: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    tier: iteration
    limits: "30 RPM / 1K RPD / 8K TPM / 200K TPD"
    inline_schema_defs: true
    notes: >
      Production status on Groq, ~10x faster, less capable (index 24).
      `inline_schema_defs` is load-bearing: PydanticAI picks the schema
      transformer from the `openai/` prefix, so this model gets OpenAI's,
      which keeps `$defs`/`$ref` -- and Groq's tool calling cannot resolve
      them. Measured 0/5 without it, 5/5 with it. Cannot disable reasoning.

  # -------------------------------------------------------------------- final
  deep:
    provider: google-gla
    model_id: gemini-3.1-pro-preview
    api_key_env: GOOGLE_AI_STUDIO_API_KEY
    tier: final
    limits: "2 RPM / 50 RPD"
    notes: >
      50 requests per day cannot sustain a multi-stage pipeline under
      iteration. Reserved for one measured comparison run.
      NOTE: the bare id `gemini-3.1-pro` (in .env and in lab/docs/llms/
      gemini.md) 404s; the API only serves the `-preview` suffix.

  frontier:
    provider: nvidia
    model_id: z-ai/glm-5.2
    api_key_env: NVIDIA_BUILD_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    tier: final
    limits: "40 RPM; NON-RENEWABLE credit trial, then HTTP 402"
    notes: >
      Highest index available anywhere here (51-53), but credits do not reset
      and large MoE models drain them fast. Known issue: malformed JSON in
      tool-call arguments, so validate before parsing. Final run only.

  frontier_alt:
    provider: nvidia
    model_id: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_BUILD_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    tier: final
    limits: "40 RPM; NON-RENEWABLE credit trial"
    notes: >
      NVIDIA-native alternative to GLM-5.2. Lower index (38-48) but no
      third-party compliance review pending against it.

# Embedding models, for candidate retrieval against the backbone (P3). Kept
# apart from `models` because they answer a different call and carry no
# thinking/schema settings.
#
# Ids verified by listing the API on 2026-08-14: the endpoint serves
# gemini-embedding-001, gemini-embedding-2 and gemini-embedding-2-preview.
embeddings:
  linker:
    provider: google-gla
    model_id: gemini-embedding-001
    api_key_env: GOOGLE_AI_STUDIO_API_KEY
    dimensions: 3072
    # Asymmetric task types: the syllabus mention is the query, the backbone
    # label is the document. Measured on 2026-08-14 to separate better than
    # SEMANTIC_SIMILARITY, whose scores sit compressed near 1 and leave an
    # unrelated pair at 0.82.
    query_task_type: RETRIEVAL_QUERY
    document_task_type: RETRIEVAL_DOCUMENT
    # Measured, not read: the quota counts each TEXT, not each call, so
    # batching does not buy headroom. Embedding the 162 backbone labels
    # exceeds one minute's allowance and has to be paced.
    requests_per_minute: 100
    notes: >
      NOT gemini-embedding-2, although it is newer and GA. Measured: it
      returns ONE embedding no matter how many contents are sent, silently
      dropping the rest of the batch. Zipping texts with results would
      mis-assign every vector after the first without raising. 001 batches
      correctly and is the only one safe for a 162-label catalog.

# Pair used for the O2 pipeline comparison: one Gemini, one Groq.
#
# NOTE (findings/0005): iterate with `reasoner_fallback`. The Gemini side is
# capped at 20 requests per day, which is under one P2 run plus one P3 run, so
# it can only be spent on the final measured comparison.
#
# The second slot holds gpt-oss-120b rather than the higher-scoring Qwen3.6
# on measured grounds, not on index: findings/0004 clocked 6/6 vs 5/6 success,
# 465 vs 1341 completion tokens and 2.0s vs 6.2s on the same task. Qwen also
# fails outright on nested schemas. Intelligence index did not predict
# contract conformance, which is what this pipeline actually needs.
comparison_matrix:
  - workhorse
  - reasoner_fallback
