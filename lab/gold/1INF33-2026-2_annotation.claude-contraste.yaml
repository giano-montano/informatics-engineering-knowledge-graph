      - label_es: "Disparadores BEFORE y AFTER"
        label_en: "BEFORE and AFTER Triggers"
        confidence: high
      - label_es: "Manejo de errores"
        label_en: "Error Handling"
        confidence: high

  - label_es: "Transacciones"
    label_en: "Transactions and Concurrency Control"
    links_to_ku: KU-DM-Internals
    confidence: high
    note: >-
      Transacciones, serializabilidad y bloqueos son el núcleo clásico de DBMS
