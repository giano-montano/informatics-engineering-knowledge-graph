# Cualquier cosa que te haya costado decidir. Se cita en el finding.
notes: >-
  CRITERIO DE GRANULARIDAD. Se usó el enlace como criterio: un Tema es la
  unidad más pequeña que apunta a una sola KU del backbone; si un candidato a
  Tema exigía enlazar a dos KUs distintas, se partió. Por eso el Capítulo 1 se
  rompe en tres temas (fundamentos, teoría de conjuntos, modelado) y por eso
  los Capítulos 1 y 2 se recombinan en el tema de modelado. La consecuencia es
  que la anotación NO respeta el índice del documento: 10 temas frente a 8
  capítulos. Si tu anotación de referencia sí mapea capítulo a tema, la
  divergencia entre ambas no es error de ninguna de las dos, es una diferencia
  de criterio que hay que declarar antes de puntuar.

  LITERALIDAD DE LOS CONCEPTOS. Ningún concepto añade contenido que el sílabo
  no nombre. Ejemplo: bajo el modelo E-R no se pusieron "cardinalidad" ni
  "atributos" aunque todo curso los enseñe, porque el pipeline solo ve el
  texto y penalizarlo por no inferirlos mide otra cosa. El costo es que temas
  como "Teoría de conjuntos y relaciones" quedan con dos conceptos pobres.

  DECISIONES DUDOSAS, EN ORDEN DE RIESGO.
  1. PL/SQL y Triggers con links_to_ku null. Es el hallazgo más fuerte de esta
     anotación: casi la mitad del semestre (15 de 45 horas del programa
     analítico) es contenido procedural específico de Oracle que el área Data
     Management de CS2023 no itemiza. Si tu referencia sí los enlazó, la
     discrepancia merece discusión propia en el finding.
  2. Normalización entre KU-DM-Relational y KU-DM-Modeling.
  3. SQL DDL forzado a KU-DM-Querying por ausencia de destino mejor.
  4. "Trabajo en equipo" (C5, RA4, RA5, Proyecto Integrador) se declaró
     out_of_scope. Existe un destino plausible en el backbone, KU-SE-Teamwork,
     y un anotador distinto podría admitirlo como Tema. Se excluyó porque es
     una competencia del perfil de egreso y una actividad de evaluación, no
     contenido dictado. Es la decisión más reversible de todas.
  5. "Teoría de conjuntos" enlaza a KU-MSF-Discrete, fuera del área DM. Si el
     pipeline solo busca destinos dentro de KA-DM, este tema es la prueba que
     lo detecta.

  TRAMPAS DE RUIDO QUE VALE LA PENA VIGILAR AL PUNTUAR.
  - Los RA1 a RA5 repiten contenido del programa analítico con otras palabras
    ("paradigma relacional", "normalización", "lenguaje estructurado de
    consultas"). Un pipeline que los procese producirá temas duplicados. No
    son temas nuevos: son la misma materia enunciada como objetivo.
  - Los dominios de los casos de estudio (factoring, contabilidad, compras)
    son sustantivos de negocio muy extraíbles y no son conocimiento del curso.
  - El título del libro de Codd contiene "relational model" y puede generar un
    tema fantasma que duplique el Tema 4.
