# Todo el sistema en un host, configurado solo por .env (ADR-007, ADR-013):
#
#   neo4j   la base de grafos, en un volumen administrado
#   api     la imagen de la aplicacion; la API lanza el worker como proceso hijo
#   web     nginx: sirve InfoKnows y reenvia /api y /resources a la API
#   build   la misma imagen con los procesos de construccion; no arranca con
#           `up`, se ejecuta a demanda y con la API detenida:
#             docker compose stop api
#             docker compose run --rm build load
#             docker compose run --rm build reapply
#             docker compose start api
#
# Para desarrollar con `uv run`, basta la base: `docker compose up -d neo4j`.
#
# Neo4j: version pineada y sin plugins; el codigo no usa ninguno.
#
# Por que 5.26 LTS y no la 2026.06 actual:
#   - 5.26 es la ultima LTS, con soporte oficial hasta junio 2028, o sea que
#     cubre Tesis 2 y la defensa sin forzar una migracion a mitad de camino.
#   - Los releases CalVer (2025.x, 2026.x) no son LTS y tienen ventanas de
#     soporte cortas: pinear uno significa defender sobre una version sin soporte.
#   - Practicamente toda la documentacion, tutoriales y literatura que vas a
#     citar asume 5.x. Menos friccion al sustentar.
#   - Costo aceptado: Cypher 5, sin Cypher 25. Registrable como limitacion; no
#     bloquea el pipeline.
#
# Edicion Community, la del despliegue: NADA del diseno puede depender de
# multi-base ni de restricciones de Enterprise; todo el grafo vive en la base
# `neo4j`. Un volumen creado con Enterprise (formato block) no abre con
# Community: o se conserva Enterprise con NEO4J_IMAGE en .env, o se crea un
# volumen nuevo (`docker compose down -v`) y se reconstruye con load y reapply.
#
# Los puertos de Neo4j se publican solo en el loopback del host: en un
# servidor, el Browser se alcanza por un tunel SSH, no desde internet.

name: iekg

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26.28-community}
    container_name: iekg-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # HTTP - Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt - driver de Python
    environment:
      # Solo la lee la imagen Enterprise (licencia de evaluacion).
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"

      # 32 GB fisicos: heap holgado y pagecache suficiente para un grafo que
      # hoy son 180 nodos y no va a pasar de unos pocos miles.
      # Una maquina mas chica los baja desde .env.
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-2G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-4G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"

      # Usada solo por el healthcheck. Sin prefijo NEO4J_ a proposito: cualquier
      # NEO4J_* desconocida hace fallar el arranque por strict validation.
      HEALTHCHECK_PASSWORD: "${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./ontology:/import/ontology:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${HEALTHCHECK_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  api:
    build: .
    image: iekg-app:local
    container_name: iekg-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment: &app-environment
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      IEKG_API_HOST: "0.0.0.0"
      IEKG_API_PORT: "8000"
      # Sin el token la API no arranca (ADR-013).
      IEKG_OPERATOR_TOKEN: "${IEKG_OPERATOR_TOKEN:-}"
      # La direccion por la que los estudiantes llegan al sistema: queda
      # escrita en los localizadores de los documentos subidos (ADR-009).
      IEKG_PUBLIC_BASE_URL: "${IEKG_PUBLIC_BASE_URL:-http://localhost}"
      # Proveedor del modelo de lenguaje; solo lo lee el worker.
      IEKG_LLM_MODEL: "${IEKG_LLM_MODEL:-}"
      IEKG_LLM_API_KEY: "${IEKG_LLM_API_KEY:-}"
      IEKG_LLM_BASE_URL: "${IEKG_LLM_BASE_URL_IN_CONTAINER:-${IEKG_LLM_BASE_URL:-}}"
      IEKG_LLM_REASONING_EFFORT: "${IEKG_LLM_REASONING_EFFORT:-}"
      IEKG_LLM_TEMPERATURE: "${IEKG_LLM_TEMPERATURE:-}"
      IEKG_LLM_MAX_RETRIES: "${IEKG_LLM_MAX_RETRIES:-3}"
      IEKG_LLM_TIMEOUT_SECONDS: "${IEKG_LLM_TIMEOUT_SECONDS:-900}"
      # Modo ensayo del flujo del operador (enmienda 2026-11 de ADR-013): las
      # corridas recorren sus estados en almacenes propios y no tocan el grafo.
      IEKG_REHEARSAL: "${IEKG_REHEARSAL:-}"
      IEKG_REHEARSAL_STEP_SECONDS: "${IEKG_REHEARSAL_STEP_SECONDS:-4}"
    volumes: &app-volumes
      # Los tres almacenes de archivos son carpetas del host (ADR-013):
      # operational.sqlite, documents/ y facts/ dentro de esta.
      - "${IEKG_DATA_DIR:-./var}:/app/var"
      # Los modelos que descarga la lectura de PDF en la primera corrida.
      - model_cache:/root/.cache
    extra_hosts:
      # Para un proveedor que corre en el propio host (servidor local de pruebas).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/overview', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  web:
    build: ./web
    image: infoknows-web:local
    container_name: iekg-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${IEKG_WEB_PORT:-80}:80"

  build:
    image: iekg-app:local
    profiles: ["build"]
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["iekg-build"]
    environment: *app-environment
    volumes: *app-volumes

volumes:
  neo4j_data:
  neo4j_logs:
  model_cache:
