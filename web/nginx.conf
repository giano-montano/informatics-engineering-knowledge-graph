# Un solo origen para la web, la API y los documentos: la aplicación llama a
# /api y /resources en relativo, así que no hay CORS ni host escrito (ADR-007).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Los sílabos subidos desde el panel del operador.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://${IEKG_API_UPSTREAM};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /resources/ {
        proxy_pass http://${IEKG_API_UPSTREAM};
        proxy_set_header Host $http_host;
    }

    # Los archivos compilados llevan su huella en el nombre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Aplicación de una sola página: cualquier otra ruta es index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
