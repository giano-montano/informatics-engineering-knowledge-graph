        confidence: high

  - label_es: "Lenguaje de programación de base de datos (PL/SQL)"
    label_en: "Database Programming Language (PL/SQL)"
    links_to_ku: null
    confidence: low
    note: >-
      Hueco de cobertura, no descuido. CS2023 en el área Data Management no
      itemiza las extensiones procedurales de SQL: bloques, procedimientos
      almacenados, cursores, excepciones. Candidatos descartados: KU-DM-Querying
      (es construcción de consultas, no programación) y KU-DM-Core (es
      arquitectura del SGBD). Si la convención del proyecto fuese "nunca null
      cuando exista algo adyacente", el destino sería KU-DM-Querying; se
      prefiere el null porque medir la no-cobertura es uno de los objetivos
      declarados de la anotación.
    concepts:
      - label_es: "Bloque de programas"
        label_en: "Program Blocks"
        confidence: high
      - label_es: "Procedimientos y funciones"
        label_en: "Stored Procedures and Functions"
        confidence: high
      - label_es: "Parámetros, variables y condiciones"
        label_en: "Parameters, Variables and Conditions"
