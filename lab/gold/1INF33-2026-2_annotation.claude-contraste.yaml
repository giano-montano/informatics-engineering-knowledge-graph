# ===========================================================================
# ANOTACIÓN DE CONTRASTE — NO ES EL GOLD.
#
# La escribió un LLM (Claude), no un anotador humano. Sirve para comparar
# contra la anotación de referencia de `giano` y para discutir criterios de
# granularidad y enlace. NO debe fusionarse con la anotación de referencia,
# ni sustituirla, ni usarse como denominador al puntuar el pipeline de R4:
# medir un LLM contra un LLM no mide lo que R4 dice medir.
#
# Nombre de archivo deliberadamente distinto del canónico para que no se
# confunda en el repo.
# ===========================================================================
#
# Anotación de referencia CIEGA — 1INF33 (2026-2)
#
# QUÉ ES. La lista de lo que TÚ esperas que un pipeline extraiga de este
# sílabo, escrita a mano y ANTES de ver ninguna salida de ningún modelo. Es la
# referencia contra la que se mide la precisión del resultado R4.
#
# POR QUÉ CIEGA. Si se anota después de leer una extracción, la anotación se
# contagia de lo que el modelo propuso y deja de ser un criterio independiente.
# Un jurado puede objetar eso y tendría razón. Mientras `blind: true` y este
# archivo no esté completo, ninguna sesión debe mostrar extracciones reales de
# 1INF33-2026-2-SILABO-BASES-DE-DATOS.PDF.
#
# CÓMO SE RELLENA.
#   1. Lee el sílabo entero.
#   2. Escribe los Temas que un lector humano sacaría de él, en el orden que
#      quieras. `label_es` tal como aparece; `label_en` la etiqueta canónica en
#      inglés, que es la que se compara contra el backbone.
#   3. Para cada Tema, la unidad de conocimiento del backbone a la que debería
#      enlazar: un identificador de `lab/gold/backbone-catalog.md`. Si crees
#      que ninguna encaja, deja `links_to_ku: null` y explica en `note`. Un
#      enlace vacío es un dato, no un hueco: mide cuánto del sílabo NO cubre
#      CS2023.
#   4. Los Conceptos de cada Tema. Si dudas de si algo es Tema o Concepto,
#      decide y sigue: la escala de la decisión también se está midiendo.
#   5. `confidence: low` en lo que dudes. Al puntuar se reporta aparte, así que
#      marcar duda no penaliza; ocultarla sí distorsiona.
#
# QUÉ NO VA AQUÍ.
#   - Prerrequisitos: fuera de esta primera comparación (handoff 2026-08-14).
#   - Cursos, docentes, evaluaciones, bibliografía: no son KnowledgeElement.
#   - Lo que un modelo podría sacar pero tú no pondrías: eso va en
#     `out_of_scope`, y es lo que permite medir el ruido.
#
# El recuento no importa. Que esté completo antes de la primera corrida, sí.

version: 1

document:
  code: 1INF33
  term: "2026-2"
  source: lab/docs/syllabus/1INF33-2026-2-SILABO-BASES-DE-DATOS.PDF

annotator: claude-contraste     # NO es `giano`. Ver cabecera.
date: 2026-08-15
blind: true           # pásalo a false si viste una extracción antes de cerrarla

# ---------------------------------------------------------------------------
# Temas esperados. Duplica el bloque tantas veces como haga falta.
# ---------------------------------------------------------------------------
topics:
  - label_es: "Datos, información y sistemas de gestión de bases de datos"
    label_en: "Data, Information and Database Management Systems"
    links_to_ku: KU-DM-Core
    confidence: high
    note: >-
      Bloque introductorio del Capítulo 1. Se enlaza a Core y no a KU-DM-Data
      porque el sílabo trata datos/información como definiciones de entrada al
      SGBD, no como ciclo de vida del dato. "Clasificación de modelos de datos"
      se dejó aquí y no en el tema de modelado: es la taxonomía previa, no la
      práctica de modelar. Es una frontera discutible.
    concepts:
      - label_es: "Datos e información"
        label_en: "Data and Information"
        confidence: high
      - label_es: "Base de datos"
        label_en: "Database"
        confidence: high
      - label_es: "Sistema de Gestión de Base de Datos (SGBD)"
        label_en: "Database Management System (DBMS)"
        confidence: high
      - label_es: "Definición de modelo y clasificación de modelos de datos"
        label_en: "Data Models: Definition and Classification"
        confidence: high

  - label_es: "Teoría de conjuntos y relaciones"
    label_en: "Set Theory and Relations"
    links_to_ku: KU-MSF-Discrete
    confidence: high
    note: >-
      Único tema del sílabo que enlaza fuera del área Data Management. Es el
      fundamento matemático que el curso dicta antes del modelo relacional.
      Alternativa defendible: no tratarlo como tema propio y volverlo un
      concepto del modelo relacional; se prefirió tema propio porque el enlace
      a KU cambia de área, y eso es exactamente la señal que interesa medir.
    concepts:
      - label_es: "Teoría de conjuntos"
        label_en: "Set Theory"
        confidence: high
      - label_es: "Relaciones"
        label_en: "Relations"
        confidence: high

  - label_es: "Diseño y modelamiento conceptual de bases de datos"
    label_en: "Conceptual Database Design and Data Modeling"
    links_to_ku: KU-DM-Modeling
    confidence: high
    note: >-
      Consolida el final del Capítulo 1 (fases del diseño, modelo E-R) con el
      Capítulo 2 (Barker, IDEF1X). El sílabo los separa por capítulo pero son
      la misma unidad de conocimiento: notaciones y proceso de modelado
      conceptual. Es el caso más claro de que el orden del documento no es el
      orden del conocimiento.
    concepts:
      - label_es: "Fases del diseño de una base de datos"
        label_en: "Database Design Phases"
        confidence: high
      - label_es: "Modelo Entidad-Relación"
        label_en: "Entity-Relationship Model"
        confidence: high
      - label_es: "Metodología y convenciones de modelamiento Barker"
        label_en: "Barker Notation"
        confidence: high
      - label_es: "Metodología y convenciones de modelamiento IDEF1X"
        label_en: "IDEF1X Notation"
        confidence: high

  - label_es: "Modelo relacional"
    label_en: "The Relational Model"
    links_to_ku: KU-DM-Relational
    confidence: high
    note: >-
      El sílabo dice "Estructura y Operaciones. Reglas de Integridad" y no
      nombra el álgebra relacional. El concepto "Operaciones del modelo
      relacional" se deja con la etiqueta genérica del sílabo, sin ascenderlo a
      "Relational Algebra": si el gold nombra algo que el documento no dice, se
      penaliza al pipeline por no alucinar.
    concepts:
      - label_es: "Estructura del modelo relacional"
        label_en: "Relational Model Structure"
        confidence: high
      - label_es: "Operaciones del modelo relacional"
        label_en: "Relational Model Operations"
        confidence: low
      - label_es: "Reglas de integridad"
        label_en: "Integrity Rules"
        confidence: high

  - label_es: "Normalización"
    label_en: "Database Normalization"
    links_to_ku: KU-DM-Relational
    confidence: low
    note: >-
      Enlace dudoso: la normalización cabe tanto en KU-DM-Relational (es teoría
      del esquema relacional) como en KU-DM-Modeling (es una etapa del diseño
      lógico). Se eligió Relational. Nótese que dos temas de esta anotación
      apuntan a la misma KU; nada en el protocolo lo prohíbe, pero conviene que
      la regla de puntuación lo contemple. "Desnormalización" aparece en la
      sumilla y NO en el programa analítico: se incluye con confianza baja
      porque un pipeline que solo lea el programa analítico no la verá, y eso
      no debería contarse como error suyo.
    concepts:
      - label_es: "Primera forma normal"
        label_en: "First Normal Form"
        confidence: high
      - label_es: "Segunda forma normal"
        label_en: "Second Normal Form"
        confidence: high
      - label_es: "Tercera forma normal"
        label_en: "Third Normal Form"
        confidence: high
      - label_es: "Desnormalización"
        label_en: "Denormalization"
