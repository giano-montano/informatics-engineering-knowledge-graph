[project]
name = "iekg"
version = "0.1.0"
description = "Grafo de conocimiento del curriculo de Ingenieria Informatica: proyeccion ontologia->LPG y pipeline de ingesta"
requires-python = ">=3.11"

dependencies = [
    # Driver oficial. Se pinea la linea 5.28 LTS, no la 6.x, para que
    # acompanhe al servidor 5.26 LTS: mismo criterio de estabilidad que
    # se uso para elegir la version del servidor.
    "neo4j>=5.28,<6",
    # Parseo de Turtle. rdflib es la libreria estandar de RDF en Python;
    # parsear el TTL a mano seria fragil y no sustentable.
    "rdflib>=7.1",
    # Archivo declarativo de reglas de esquema.
    "pyyaml>=6.0",
    # Salida estructurada del LLM en la fase de extraccion.
    "pydantic>=2.9",
    # Lectura de .env (credenciales de Neo4j fuera del codigo).
    "python-dotenv>=1.0",
    "pydantic-ai-slim[google,groq,openai]>=1.0",
    "docling>=2.120.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iekg"]
